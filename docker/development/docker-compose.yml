name: setive-erp-dev

x-customizable-image: &customizable_image
  image: frappe/erpnext:v16.33.0
  restart: unless-stopped

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  # 자체 environment 블록이 없는 서비스(queue-*, scheduler, websocket)용.
  # backend 는 자체 블록이 있어 이 값이 무시되므로 거기에도 같은 줄을 직접 넣었다.
  environment:
    PYTHONPATH: /home/frappe/frappe-bench/apps/setive_erpnext_kr
  volumes:
    - sites-data:/home/frappe/frappe-bench/sites
    # sites/assets 는 컨테이너 레이어(/home/frappe/frappe-bench/assets)를 가리키는 심볼릭
    # 링크라 컨테이너를 재생성하면 컴파일한 MO 가 이미지 원본으로 되돌아간다. 번역
    # 바이너리만 볼륨으로 분리해 configurator 가 컴파일한 결과를 전 컨테이너가 공유한다.
    - locale-data:/home/frappe/frappe-bench/assets/locale
    - ../../:/home/frappe/frappe-bench/apps/erpnext
    - ../../../setive_erpnext_kr:/home/frappe/frappe-bench/apps/setive_erpnext_kr
    # 포크를 apps/erpnext 에 바인드 마운트하면 이미지에 구워진 dist(1.8M)가
    # 가려져 /assets/erpnext/dist/** 가 전부 404 가 된다. 이 이미지에는 node 가
    # 없어 bench build 로 재생성할 수도 없으므로 dist 만 볼륨으로 되살린다.
    - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist

services:
  mariadb:
    image: mariadb:10.6
    container_name: setive-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-file-per-table=1
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    container_name: setive-redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:7-alpine
    container_name: setive-redis-queue
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  configurator:
    <<: *customizable_image
    container_name: setive-configurator
    environment:
      # ⚠ configurator 는 x-backend-defaults 앵커가 아니라 customizable_image 를 쓴다.
      #   여기에 PYTHONPATH 가 없으면 apps.txt 에 있는 앱을 import 하지 못해
      #   bench new-site 를 포함한 **모든 bench 명령**이 ModuleNotFoundError 로 실패한다.
      PYTHONPATH: /home/frappe/frappe-bench/apps/setive_erpnext_kr
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - locale-data:/home/frappe/frappe-bench/assets/locale
      - ../../:/home/frappe/frappe-bench/apps/erpnext
      - ../../../setive_erpnext_kr:/home/frappe/frappe-bench/apps/setive_erpnext_kr
      # 포크를 apps/erpnext 에 바인드 마운트하면 이미지에 구워진 dist(1.8M)가
      # 가려져 /assets/erpnext/dist/** 가 전부 404 가 된다. 이 이미지에는 node 가
      # 없어 bench build 로 재생성할 수도 없으므로 dist 만 볼륨으로 되살린다.
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
    entrypoint:
      - bash
      - -c
      - |
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host mariadb;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
        bench set-config -g developer_mode 1;
        if [ ! -d /home/frappe/frappe-bench/sites/localhost ]; then
          echo "Initializing site localhost..."
          bench new-site localhost \
            --db-host mariadb \
            --db-port 3306 \
            --mariadb-root-password admin \
            --admin-password admin \
            --no-mariadb-socket \
            --install-app erpnext \
            --set-default
          echo "Site localhost initialized successfully."
        else
          echo "Site localhost already exists."
        fi
        if ! bench --site localhost list-apps | grep -q setive_erpnext_kr; then
          echo "Installing setive_erpnext_kr...";
          bench --site localhost install-app setive_erpnext_kr;
        fi
        echo "Applying regional defaults and compiling ko translations...";
        bench --site localhost execute setive_erpnext_kr.korea.common.system_defaults.configure_target_languages;
        # compile_translations 는 sites/assets/locale/... 에 MO 를 쓴다. sites/assets 는
        # /home/frappe/frappe-bench/assets(= locale-data 볼륨) 를 가리키는 심볼릭인데,
        # 신규 사이트 부트스트랩에서는 이 심볼릭이 아직 없을 수 있다. 그러면 MO 가
        # sites 볼륨 안의 실제 디렉터리에 쓰이고, 나중에 심볼릭이 생기면서 가려져
        # 번역이 조용히 적용되지 않는다. 컴파일 전에 심볼릭을 보장한다.
        ln -sfn /home/frappe/frappe-bench/assets /home/frappe/frappe-bench/sites/assets;
        bench --site localhost execute frappe.gettext.translate.compile_translations --kwargs "{'locale': 'ko', 'force': True}";
        bench --site localhost clear-cache;
        # 앱 MO 가 실제로 볼륨에 떨어졌는지 확인 (조용한 실패 방지)
        if [ -f /home/frappe/frappe-bench/assets/locale/ko/LC_MESSAGES/setive_erpnext_kr.mo ]; then
          echo "ko translations OK (setive_erpnext_kr.mo present).";
        else
          echo "WARNING: setive_erpnext_kr.mo missing — run 'make po' after startup.";
        fi;
        echo "Bootstrap complete.";
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    restart: on-failure

  backend:
    <<: *backend_defaults
    container_name: setive-backend
    environment:
      # setive_erpnext_kr 는 바인드 마운트지만 pip editable 설치 기록(.pth)은
      # env/lib/.../site-packages(컨테이너 레이어)에 남아 재생성마다 사라진다.
      # 앱 디렉터리를 PYTHONPATH 에 얹어 재생성에도 import 가 유지되게 한다.
      # ⚠ YAML 병합키는 매핑을 깊게 합치지 않는다 — 서비스가 자체 environment 를
      #   가지면 앵커의 environment 는 통째로 무시되므로 서비스마다 직접 넣는다.
      PYTHONPATH: /home/frappe/frappe-bench/apps/setive_erpnext_kr
      GUNICORN_THREADS: 4
      GUNICORN_WORKERS: 2
      GUNICORN_TIMEOUT: 120

  frontend:
    <<: *customizable_image
    container_name: setive-frontend
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: $$host
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      # 8000 은 같은 머신의 다른 프로젝트(OwnGo 개발 스택)가 점유하는 경우가 있어
      # 8002 를 쓴다. 포트가 겹치면 frontend 컨테이너만 조용히 기동 실패하고
      # (backend 는 정상) 브라우저는 남의 스택 응답을 받으므로 진단이 어렵다.
      - "8002:8080"
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - ../../:/home/frappe/frappe-bench/apps/erpnext
      - ../../../setive_erpnext_kr:/home/frappe/frappe-bench/apps/setive_erpnext_kr
      # 포크를 apps/erpnext 에 바인드 마운트하면 이미지에 구워진 dist(1.8M)가
      # 가려져 /assets/erpnext/dist/** 가 전부 404 가 된다. 이 이미지에는 node 가
      # 없어 bench build 로 재생성할 수도 없으므로 dist 만 볼륨으로 되살린다.
      - erpnext-dist:/home/frappe/frappe-bench/apps/erpnext/erpnext/public/dist
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *backend_defaults
    container_name: setive-websocket
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js

  queue-short:
    <<: *backend_defaults
    container_name: setive-queue-short
    command: bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    container_name: setive-queue-long
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend_defaults
    container_name: setive-scheduler
    command: bench schedule

volumes:
  mariadb-data:
  sites-data:
  # 컴파일된 gettext MO 전용. 이미지 업그레이드 시에도 configurator 가 매 기동마다
  # ko.po 기준으로 다시 컴파일하므로 별도 정리가 필요 없다.
  locale-data:
  # 이미지의 erpnext/public/dist 를 담는다. 최초 마운트 시 Docker 가 이미지
  # 레이어의 내용을 볼륨으로 복사한다. 이미지 태그를 올린 뒤에는 이 볼륨을
  # 삭제해야 새 자산이 반영된다(docker volume rm setive-erp-dev_erpnext-dist).
  erpnext-dist:
